[project]
name = "wkl-llm-ops"
version = "0.6.0"
description = "WKL-LLM运维平台 —— 面向本地大模型推理服务的轻量运维控制台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "llm", "llmops", "observability", "monitoring",
    "llama.cpp", "ollama", "vllm", "sglang", "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "coverage[toml]>=7.6",
    # 静态检查工具**精确锁定到具体版本**（``==``，不是 ``~=`` 也不是范围）。
    #
    # 为什么不放宽：ruff 的检查规则连**补丁版本**都会增减。实测踩过一次：
    # 本地 ruff 0.16.9 通过，CI 的 0.16.10 却报出 SIM102 与 F841 两个错。
    # 因此 ``~=0.16.10``（允许 0.16.x 漂移）同样不可靠，``>=x,<y`` 更糟 ——
    # CI 每次 ``pip install -e '.[dev]'`` 都会解析到当时最新的版本，
    # 于是「本地全绿、CI 变红」会随机复发。
    #
    # 门禁必须两边跑的是**同一把尺子**：精确锁定才能保证这一点。
    # 升级方式：走 Dependabot PR（它会把这一行改成新的精确版本），
    # 合入前 CI 就针对那个具体版本验证过，本地即可对齐。
    #
    # 0.17.5 已在纯净基线上验证：ruff check 与 ruff format --check 全部通过。
    "ruff==0.17.6",
    "mypy~=2.4.0",
]
# 文档导出（Markdown → Word）；不带也不影响控制台运行
docs = ["python-docx>=1.1"]
# 远程部署辅助脚本（deploy/remote.py、upload.py、sync_from_host.py）
remote = ["paramiko>=3.4"]

[project.urls]
Homepage = "https://github.com/stevencui581/WKL-LLM-Ops-Platform"
Documentation = "https://github.com/stevencui581/WKL-LLM-Ops-Platform/tree/main/docs"
Issues = "https://github.com/stevencui581/WKL-LLM-Ops-Platform/issues"
Changelog = "https://github.com/stevencui581/WKL-LLM-Ops-Platform/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["build", ".venv", "static"]

[tool.ruff.lint]
# ASYNC 规则集可在静态检查阶段拦截「async 函数里调用 subprocess.run / time.sleep」
# 这类运行时完全不可见、只表现为偶发卡顿的错误（方案 12.7 第 1 条、13.6）
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
# 运维脚本（探针/部署）天然是"打开-读取-丢弃"的短命脚本：
# 强制 with 上下文管理器只会增加噪音，不带来实际收益（文件句柄随进程退出释放）。
# 但**真正的**问题（未使用变量 F841、歧义变量名 E741）仍然照常检查。
"probes/*" = ["SIM115"]
"deploy/*" = ["SIM115"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psutil.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
# 覆盖率是发现「哪些代码没被测到」的工具，不是「测试有多好」的指标；
# 门禁只卡核心模块（collectors / services），见方案 13.6
fail_under = 0

[tool.coverage.paths]
source = ["app"]

# ---------------------------------------------------------------- 构建与打包
#
# **不加这一段，`pip install .` / `pip install -e .` 会直接失败**：
#
#     error: Multiple top-level packages discovered in a flat-layout:
#            ['app', 'static', 'deploy', 'probes']
#
# setuptools 的自动发现在扁平布局里看到多个顶层目录就拒绝构建。
# 本项目是**应用**而不是库，除 app/ 之外的目录（static / deploy / probes /
# tools / tests / docs / examples）都不是待分发的包，必须显式排除。
#
# 注意：不能改成 ``pip install -r requirements.txt`` 来绕过 ——
# ``[project.optional-dependencies]`` 的 dev 依赖只能通过 extras 安装，
# CI 与贡献者文档都用的是 ``pip install -e '.[dev]'``。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false
