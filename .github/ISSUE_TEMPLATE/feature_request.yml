name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先说明**你要解决的问题**，而不只是你想要的实现方式 ——
        这样更容易找到更合适的方案。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认这不是重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题？
      placeholder: |
        我用 vLLM 部署，页面的「槽位」面板是空的，
        但我不确定是 vLLM 不提供这个接口，还是控制台采集失败了。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它方案

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 推理框架识别
        - 槽位 / KV 容量
        - 算力卡 / 硬件清点
        - 告警
        - 日志（历史 / 实时）
        - 服务管理
        - 前端界面 / 双语
        - 部署 / 安装
        - 文档
        - 其它

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其它项目的做法、参考资料、截图等
