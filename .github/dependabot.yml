version: 2
updates:
  # Python 依赖
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # 把开发工具链的更新合并成一个 PR，避免噪音
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "coverage*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
